<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — The Weekly Debate &amp; Consensus Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper: rgb(248, 250, 252);
    --paper-raised: rgb(204, 224, 255);
    --ink: #1c1b19;
    --ink-soft: #0c2048;
    --ink-faint: #000000;
    --rule: #96add77d;
    --gold: #000000;
    --against-color: #ee4a4a;
    --against-color-soft: #f69e8d7d;
    --for-color: #44bf7f;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    padding: 48px 20px 80px;
  }
  .sheet{ max-width: 620px; margin:0 auto; }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display:flex; align-items:center; gap:10px;
    margin-bottom: 10px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); }
  .masthead{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(26px, 5vw, 34px);
    margin: 0 0 28px;
  }
  .card{
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    padding: 24px;
    margin-bottom: 22px;
  }
  label{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 14px 0 5px;
  }
  label:first-child{ margin-top:0; }
  input, textarea{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size: 15px;
    padding: 10px 11px;
    border: 1px solid var(--rule);
    background:#fff;
    color: var(--ink);
  }
  textarea{ resize: vertical; min-height: 60px; }
  .btn{
    margin-top: 16px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12.5px;
    letter-spacing:0.05em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-raised);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn:hover{ background:#3a352a; }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn-ghost{
    background: none;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
  }
  .btn-ghost:hover{ background: rgba(0,0,0,0.04); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 22px; }
  .topbar .who{ font-family:'Space Grotesk', sans-serif; font-size: 12.5px; color: var(--ink-soft); }
  .msg{
    margin-top: 14px;
    padding: 10px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12.5px;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.error{ border:1px solid var(--against-color); background: var(--against-color-soft); color: var(--against-color); }
  .msg.ok{ border:1px solid var(--for-color); background:#DCE4DA; color:#245c3d; }
  .section-label{
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 30px 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background: var(--rule); }
  .week-row{
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .week-row .label{ font-family:'Space Grotesk', sans-serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold); }
  .week-row .headline{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; margin: 3px 0; }
  .week-row .meta{ font-family:'Space Grotesk', sans-serif; font-size:11px; color: var(--ink-soft); }
  .loading-line{ font-family:'Space Grotesk', sans-serif; font-size:12px; color: var(--ink-faint); }
  #admin-view{ display:none; }
</style>
</head>
<body>
<div class="sheet">
  <div class="eyebrow"><span class="dot"></span>Involeap &nbsp;·&nbsp; Admin</div>
  <h1 class="masthead">Weekly Debate — Admin</h1>

  <!-- ===================== LOGIN ===================== -->
  <div class="card" id="auth-view">
    <label for="auth-email">Email</label>
    <input type="email" id="auth-email" placeholder="you@involeap.org" autocomplete="username" />
    <label for="auth-password">Password</label>
    <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn" id="login-btn" onclick="login()">Log in</button>
    <div class="msg error" id="auth-msg"></div>
  </div>

  <!-- ===================== ADMIN ===================== -->
  <div id="admin-view">
    <div class="topbar">
      <span class="who" id="who-line"></span>
      <button class="btn btn-ghost" onclick="logout()">Log out</button>
    </div>

    <div class="card">
      <label for="cfg-week">Week label</label>
      <input type="text" id="cfg-week" placeholder="Week 03" />
      <label for="cfg-headline">Topic (neutral framing)</label>
      <input type="text" id="cfg-headline" placeholder="Should remote work be the default for knowledge jobs?" />
      <label for="cfg-framing">One-line context for voters</label>
      <textarea id="cfg-framing" placeholder="A short, neutral sentence explaining what's being argued."></textarea>
      <label for="cfg-stances">Stances (comma-separated, e.g. "For, Against")</label>
      <input type="text" id="cfg-stances" placeholder="For, Against" value="For, Against" />
      <button class="btn" id="save-btn" onclick="saveWeek()">Publish as new week</button>
      <div class="msg" id="save-msg"></div>
    </div>

    <div class="section-label">Past weeks</div>
    <div class="loading-line" id="history-loading">Loading history…</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://fevvbxdxnqaltrhakrmu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldnZieGR4bnFhbHRyaGFrcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODEwNDQsImV4cCI6MjEwMjA1NzA0NH0.BC15V81UR3L9HnbYToo4LWto52_HP5kY9gO5mpYGhQA";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function showMsg(el, text, ok){
    el.textContent = text;
    el.classList.remove('error','ok');
    el.classList.add('show', ok ? 'ok' : 'error');
  }

  async function checkSession(){
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
      document.getElementById('who-line').textContent = 'Logged in as ' + session.user.email;
      loadHistory();
    } else {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('admin-view').style.display = 'none';
    }
  }

  async function login(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('auth-msg');
    msg.classList.remove('show');

    if (!email || !password) {
      showMsg(msg, 'Enter both email and password.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in…';
    const { error } = await db.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Log in';

    if (error) {
      showMsg(msg, 'Login failed — check your email and password.', false);
      return;
    }
    checkSession();
  }

  async function logout(){
    await db.auth.signOut();
    checkSession();
  }

  async function saveWeek(){
    const { data: { session } } = await db.auth.getSession();
    if (!session) { checkSession(); return; }

    const weekLabel = document.getElementById('cfg-week').value.trim();
    const headline = document.getElementById('cfg-headline').value.trim();
    const framing = document.getElementById('cfg-framing').value.trim();
    const stancesRaw = document.getElementById('cfg-stances').value.trim();
    const stances = stancesRaw.split(',').map(s => s.trim()).filter(Boolean);
    const msg = document.getElementById('save-msg');
    msg.classList.remove('show');

    if (!weekLabel || !headline || stances.length < 2) {
      showMsg(msg, 'Week label, topic, and at least two stances are required.', false);
      return;
    }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = 'Publishing…';

    try {
      const { error } = await db.from('weeks').insert([{
        week_label: weekLabel,
        headline: headline,
        framing: framing,
        stances: stances,
        created_by: session.user.id
      }]);
      if (error) throw error;

      showMsg(msg, 'Published — this is now the live topic on the public page.', true);
      document.getElementById('cfg-week').value = '';
      document.getElementById('cfg-headline').value = '';
      document.getElementById('cfg-framing').value = '';
      document.getElementById('cfg-stances').value = 'For, Against';
      loadHistory();
    } catch (e) {
      console.error('Save error:', e);
      showMsg(msg, 'Could not save — check your connection and try again.', false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish as new week';
    }
  }

  async function loadHistory(){
    const loadingEl = document.getElementById('history-loading');
    const listEl = document.getElementById('history-list');
    loadingEl.style.display = 'block';
    listEl.innerHTML = '';

    try {
      const { data, error } = await db
        .from('weeks')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;

      loadingEl.style.display = 'none';

      if (!data || !data.length) {
        listEl.innerHTML = '<div class="loading-line">No weeks published yet.</div>';
        return;
      }

      listEl.innerHTML = data.map((w, i) => `
        <div class="week-row">
          <div class="label">${escapeHtml(w.week_label)}${i === 0 ? ' — LIVE NOW' : ''}</div>
          <div class="headline">${escapeHtml(w.headline)}</div>
          <div class="meta">${(Array.isArray(w.stances) ? w.stances : []).map(escapeHtml).join(' · ')} — ${new Date(w.created_at).toLocaleString()}</div>
        </div>
      `).join('');
    } catch (e) {
      console.error('History load error:', e);
      loadingEl.textContent = 'Could not load history.';
    }
  }

  checkSession();
</script>
</body>
</html>
