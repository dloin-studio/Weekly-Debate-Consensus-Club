<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — The Weekly Debate &amp; Consensus Club</title>
<link rel="icon" type="image/png" href="..\logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper: rgb(248, 250, 252);
    --paper-raised: rgb(204, 224, 255);
    --ink: #1c1b19;
    --ink-soft: #0c2048;
    --ink-faint: #000000;
    --rule: #96add77d;
    --gold: #000000;
    --against-color: #ee4a4a;
    --against-color-soft: #f69e8d7d;
    --for-color: #44bf7f;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    padding: 48px 20px 80px;
  }
  .sheet{ max-width: 620px; margin:0 auto; }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display:flex; align-items:center; gap:10px;
    margin-bottom: 10px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); }
  .masthead{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(26px, 5vw, 34px);
    margin: 0 0 28px;
  }
  .card{
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    padding: 24px;
    margin-bottom: 22px;
  }
  label{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 14px 0 5px;
  }
  label:first-child{ margin-top:0; }
  input, textarea{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size: 15px;
    padding: 10px 11px;
    border: 1px solid var(--rule);
    background:#fff;
    color: var(--ink);
  }
  textarea{ resize: vertical; min-height: 60px; }
  .btn{
    margin-top: 16px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12.5px;
    letter-spacing:0.05em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper-raised);
    border: none;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn:hover{ background:#3a352a; }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn-ghost{
    background: none;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
  }
  .btn-ghost:hover{ background: rgba(0,0,0,0.04); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 22px; }
  .topbar .who{ font-family:'Space Grotesk', sans-serif; font-size: 12.5px; color: var(--ink-soft); }
  .msg{
    margin-top: 14px;
    padding: 10px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12.5px;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.error{ border:1px solid var(--against-color); background: var(--against-color-soft); color: var(--against-color); }
  .msg.ok{ border:1px solid var(--for-color); background:#DCE4DA; color:#245c3d; }
  .section-label{
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 30px 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background: var(--rule); }
  .week-row{
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .week-row .label{ font-family:'Space Grotesk', sans-serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold); }
  .week-row .headline{ font-family:'Fraunces', serif; font-weight:600; font-size:18px; margin: 4px 0; }
  .week-row .meta{ font-family:'Space Grotesk', sans-serif; font-size:11.5px; color: var(--ink-soft); }
  
  .week-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn-small {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 6px 12px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn-small:hover { background: rgba(34,30,23,0.06); }
  .btn-small.active-state { background: var(--ink); color: var(--paper-raised); }
  .btn-small.danger { color: var(--against-color); border-color: var(--against-color-soft); }
  .btn-small.danger:hover { background: var(--against-color-soft); }
  
  .loading-line{ font-family:'Space Grotesk', sans-serif; font-size:12px; color: var(--ink-faint); }
  .entries-panel{ margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .entry-row{ padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .entry-row:last-child{ border-bottom: none; }
  .entry-meta{ font-family:'Space Grotesk', sans-serif; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .entry-essay{ font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  #admin-view{ display:none; }
</style>
</head>
<body>
<div class="sheet">
  <div class="eyebrow"><span class="dot"></span>Involeap &nbsp;·&nbsp; Admin</div>
  <h1 class="masthead">Weekly Debate — Admin</h1>

  <!-- ===================== LOGIN ===================== -->
  <div class="card" id="auth-view">
    <form id="login-form" onsubmit="return handleLoginSubmit(event)">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" name="email" placeholder="you@involeap.org" autocomplete="username" />
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" name="password" placeholder="••••••••" autocomplete="current-password" />
      <button type="submit" class="btn" id="login-btn">Log in</button>
      <div class="msg error" id="auth-msg"></div>
    </form>
  </div>

  <!-- ===================== ADMIN ===================== -->
  <div id="admin-view">
    <div class="topbar">
      <span class="who" id="who-line"></span>
      <button class="btn btn-ghost" onclick="logout()">Log out</button>
    </div>

    <div class="card">
      <label for="cfg-week">Week label</label>
      <input type="text" id="cfg-week" placeholder="Week 03" />
      <label for="cfg-headline">Topic (neutral framing)</label>
      <input type="text" id="cfg-headline" placeholder="Should remote work be the default for knowledge jobs?" />
      <label for="cfg-framing">One-line context for voters</label>
      <textarea id="cfg-framing" placeholder="A short, neutral sentence explaining what's being argued."></textarea>
      <label for="cfg-stances">Stances (comma-separated, e.g. "For, Against")</label>
      <input type="text" id="cfg-stances" placeholder="For, Against" value="For, Against" />
      <button class="btn" id="save-btn" onclick="saveWeek()">Publish as new week</button>
      <div class="msg" id="save-msg"></div>
    </div>

    <div class="section-label">Manage Weeks</div>
    <div class="loading-line" id="history-loading">Loading history…</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://fevvbxdxnqaltrhakrmu.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldnZieGR4bnFhbHRyaGFrcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODEwNDQsImV4cCI6MjEwMjA1NzA0NH0.BC15V81UR3L9HnbYToo4LWto52_HP5kY9gO5mpYGhQA";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function showMsg(el, text, ok){
    el.textContent = text;
    el.classList.remove('error','ok');
    el.classList.add('show', ok ? 'ok' : 'error');
  }

  async function checkSession(){
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'block';
      document.getElementById('who-line').textContent = 'Logged in as ' + session.user.email;
      loadHistory();
    } else {
      document.getElementById('auth-view').style.display = 'block';
      document.getElementById('admin-view').style.display = 'none';
    }
  }

  // A real <form> submit (rather than a plain button onclick) is what
  // lets the browser recognize this as a login form and offer to save it.
  function handleLoginSubmit(evt){
    evt.preventDefault();
    login();
    return false;
  }

  async function login(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('login-btn');
    const msg = document.getElementById('auth-msg');
    msg.classList.remove('show');

    if (!email || !password) {
      showMsg(msg, 'Enter both email and password.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in…';
    const { error } = await db.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Log in';

    if (error) {
      showMsg(msg, 'Login failed — check your email and password.', false);
      return;
    }
    checkSession();
  }

  async function logout(){
    await db.auth.signOut();
    checkSession();
  }

  async function saveWeek(){
    const { data: { session } } = await db.auth.getSession();
    if (!session) { checkSession(); return; }

    const weekLabel = document.getElementById('cfg-week').value.trim();
    const headline = document.getElementById('cfg-headline').value.trim();
    const framing = document.getElementById('cfg-framing').value.trim();
    const stancesRaw = document.getElementById('cfg-stances').value.trim();
    const stances = stancesRaw.split(',').map(s => s.trim()).filter(Boolean);
    const msg = document.getElementById('save-msg');
    msg.classList.remove('show');

    if (!weekLabel || !headline || stances.length < 2) {
      showMsg(msg, 'Week label, topic, and at least two stances are required.', false);
      return;
    }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = 'Publishing…';

    try {
      // Deactivate other weeks before creating this new one
      const { data: activeWeeks } = await db.from('weeks').select('id').eq('is_active', true);
      if (activeWeeks && activeWeeks.length > 0) {
        for (let w of activeWeeks) {
          await db.from('weeks').update({ is_active: false }).eq('id', w.id);
        }
      }

      // Publish as the new LIVE week, voting disabled by default
      const { error } = await db.from('weeks').insert([{
        week_label: weekLabel,
        headline: headline,
        framing: framing,
        stances: stances,
        is_active: true,
        voting_enabled: false,
        created_by: session.user.id
      }]);
      if (error) throw error;

      showMsg(msg, 'Published — this is now the live topic on the public page.', true);
      document.getElementById('cfg-week').value = '';
      document.getElementById('cfg-headline').value = '';
      document.getElementById('cfg-framing').value = '';
      document.getElementById('cfg-stances').value = 'For, Against';
      loadHistory();
    } catch (e) {
      console.error('Save error:', e);
      showMsg(msg, 'Could not save — check your connection and try again.', false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish as new week';
    }
  }

  async function toggleVoting(id, currentState) {
    try {
      await db.from('weeks').update({ voting_enabled: !currentState }).eq('id', id);
      loadHistory();
    } catch (e) {
      console.error('Toggle voting error:', e);
      alert('Could not change voting status.');
    }
  }

  async function setActive(id) {
    try {
      const { data: activeWeeks } = await db.from('weeks').select('id').eq('is_active', true);
      if (activeWeeks && activeWeeks.length > 0) {
        for (let w of activeWeeks) {
          await db.from('weeks').update({ is_active: false }).eq('id', w.id);
        }
      }
      await db.from('weeks').update({ is_active: true }).eq('id', id);
      loadHistory();
    } catch (e) {
      console.error('Set active error:', e);
      alert('Could not set active week.');
    }
  }

  async function deleteWeek(id, label) {
    // Submissions reference their week (week_id, FK with ON DELETE RESTRICT —
    // see migration.sql), so a week that has entries can't be hard-deleted:
    // that data is kept for history on purpose. Check first and explain
    // clearly instead of letting the delete fail with a raw DB error.
    const { count, error: countErr } = await db
      .from('submissions')
      .select('id', { count: 'exact', head: true })
      .eq('week_id', id);

    if (!countErr && count > 0) {
      alert(`Can't delete ${label} — it has ${count} submission${count === 1 ? '' : 's'} on record. Submissions are kept for history, so set a different week active instead of deleting this one.`);
      return;
    }

    if (!confirm(`Delete ${label}? It has no submissions, so this is permanent.`)) return;
    try {
      const { error } = await db.from('weeks').delete().eq('id', id);
      if (error) throw error;
      loadHistory();
    } catch (e) {
      console.error('Delete error:', e);
      alert('Could not delete week.');
    }
  }

  // Fetches a week's submissions on demand and toggles them open inline —
  // this is how the admin reviews a past (inactive) week's entries.
  async function toggleEntries(id) {
    const panel = document.getElementById('entries-' + id);
    if (!panel) return;
    const isOpen = panel.style.display === 'block';
    if (isOpen) { panel.style.display = 'none'; return; }

    panel.style.display = 'block';
    panel.innerHTML = '<div class="loading-line">Loading entries…</div>';
    try {
      const { data, error } = await db
        .from('submissions')
        .select('*')
        .eq('week_id', id)
        .order('created_at', { ascending: false });
      if (error) throw error;

      if (!data || !data.length) {
        panel.innerHTML = '<div class="loading-line">No submissions for this week.</div>';
        return;
      }
      panel.innerHTML = data.map(s => `
        <div class="entry-row">
          <div class="entry-meta">${escapeHtml(s.stance)} · ${escapeHtml(s.anonymous ? 'Anonymous' : s.author)} · ${s.word_count} words · ${s.votes || 0} votes · ${new Date(s.created_at).toLocaleString()}</div>
          <div class="entry-essay">${escapeHtml(s.essay)}</div>
        </div>
      `).join('');
    } catch (e) {
      console.error('Load entries error:', e);
      panel.innerHTML = '<div class="loading-line">Could not load entries.</div>';
    }
  }

  async function loadHistory(){
    const loadingEl = document.getElementById('history-loading');
    const listEl = document.getElementById('history-list');
    loadingEl.style.display = 'block';
    listEl.innerHTML = '';

    try {
      const { data, error } = await db
        .from('weeks')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;

      loadingEl.style.display = 'none';

      if (!data || !data.length) {
        listEl.innerHTML = '<div class="loading-line">No weeks published yet.</div>';
        return;
      }

      // One query for every week's submission count, grouped client-side,
      // instead of a separate round trip per row.
      const counts = {};
      const { data: allSubs } = await db.from('submissions').select('week_id');
      (allSubs || []).forEach(s => { if (s.week_id) counts[s.week_id] = (counts[s.week_id] || 0) + 1; });

      listEl.innerHTML = data.map((w) => `
        <div class="week-row">
          <div class="label">${escapeHtml(w.week_label)}${w.is_active ? ' — LIVE NOW' : ''}</div>
          <div class="headline">${escapeHtml(w.headline)}</div>
          <div class="meta">${(Array.isArray(w.stances) ? w.stances : []).map(escapeHtml).join(' · ')} — ${new Date(w.created_at).toLocaleString()}</div>
          
          <div class="week-actions">
            <button class="btn-small ${w.voting_enabled ? 'active-state' : ''}" onclick="toggleVoting('${w.id}', ${w.voting_enabled})">
              ${w.voting_enabled ? 'Voting is ON (Click to Disable)' : 'Voting is OFF (Click to Enable)'}
            </button>
            <button class="btn-small ${w.is_active ? 'active-state' : ''}" onclick="setActive('${w.id}')" ${w.is_active ? 'disabled' : ''}>
              ${w.is_active ? 'Currently Active' : 'Set as Active Week'}
            </button>
            <button class="btn-small" onclick="toggleEntries('${w.id}')">
              View entries (${counts[w.id] || 0})
            </button>
            <button class="btn-small danger" onclick="deleteWeek('${w.id}', '${escapeHtml(w.week_label).replace(/'/g, "\\'")}')">
              Delete
            </button>
          </div>
          <div class="entries-panel" id="entries-${w.id}" style="display:none;"></div>
        </div>
      `).join('');
    } catch (e) {
      console.error('History load error:', e);
      loadingEl.textContent = 'Could not load history.';
    }
  }

  checkSession();
</script>
</body>
</html>
